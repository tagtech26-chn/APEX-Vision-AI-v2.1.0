name: APEX Vision AI v2.2 Geometry Lab Validation

on:
  push:
    branches:
      - feature/v2.2-ai-geometry-lab
  pull_request:
    branches:
      - feature/v2.1-production-hardening

jobs:
  geometry-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install geometry test dependencies
        run: python -m pip install --upgrade pip pytest numpy opencv-python-headless

      - name: Compile Python sources
        run: python -m compileall -q app tests

      - name: Run metric floor regression
        run: python -m pytest -q tests/test_v22_metric_floor.py
